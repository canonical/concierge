name: Tests

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      bases:
        # JSON array of {"base": "...", "runner": "..."} entries. Each base is a spread system
        # label declared in spread.yaml; runner is the GHA runner label whose
        # OS matches that base (the github-ci backend is adhoc-on-localhost,
        # so the runner's OS must match the system label spread is asked for).
        required: true
        type: string

jobs:
  binaries:
    name: Build concierge
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Run tests
        run: |
          go test -v -race ./...

      - name: Setup goreleaser
        run: |
          sudo snap install --classic goreleaser

      - name: Build concierge
        id: build
        run: |
          goreleaser build --clean --snapshot --single-target --output .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOS: linux
          GOARCH: ${{ inputs.arch }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: binary-${{ inputs.arch }}
          path: ./concierge

  define-matrix:
    name: Define spread matrix
    runs-on: ubuntu-latest
    outputs:
      critical: ${{ steps.suites.outputs.critical }}
      extras: ${{ steps.suites.outputs.extras }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Install
        run: |
          go install github.com/canonical/spread/cmd/spread@a3a44a96b6d00a72b0476756c70e3fb6610e7b48  # 2026-03-26

      - name: Generate matrix list
        id: suites
        env:
          ARCH: ${{ inputs.arch }}
          BASES: ${{ inputs.bases }}
        run: |
          # Enumerate suite names per system rather than once: a task that
          # declares `systems: [ubuntu-26.04]` is invisible to a listing of
          # 24.04 and would never be scheduled anywhere, silently. Asking
          # spread per base keeps the matrix exactly what spread would run.
          per_base='[]'
          for base in $(echo "$BASES" | jq -r '.[].base'); do
            suites="$(spread -list "github-ci:$base" | sed "s|github-ci:$base:tests/||g" | jq -r -ncR '[inputs | select(length>0)]')"
            per_base=$(jq -c -n --argjson acc "$per_base" --argjson s "$suites" --arg b "$base" \
              '$acc + [$s[] | {suite: ., base: $b}]')
          done
          # The suite skip-list below is keyed on suite name alone, so keep a
          # flat list of the distinct names for it to filter.
          list=$(echo "$per_base" | jq -c '[.[].suite] | unique')
          case $ARCH in
            ppc64le|s390x)
              skip='{
                "preset-k8s": "Uses k8s snap.",
                "provider-k8s": "Uses k8s snap.",
                "preset-microk8s": "Uses microk8s snap.",
                "provider-microk8s": "Uses microk8s snap.",
                "juju-extra-bootstrap-args": "Uses microk8s snap.",
                "preset-dev": "Uses k8s and microk8s snaps.",
                "overrides-env": "Uses k8s and rockcraft snaps.",
                "provider-lxd-init-no-bootstrap": "Packs a charm (from charmcraft init) for only standard bases."
              }'
              echo "Skipping these tests:"
              echo $skip | jq
              list=$(echo "$list" | jq --compact-output --argjson skip "$skip" 'map(select(. as $item | $skip | has($item) | not))')
              ;;
            amd64)
              echo 'Standard architecture, using all tests.'
              ;;
            *)
              echo "Unknown architecture $ARCH, using all tests."
              ;;
          esac

          # Suites whose failure should block merge. The required-check
          # aggregator (spread-required) only gates on these. Everything
          # else still runs in spread-extras so we keep the signal, but a
          # red extras job does not block the PR.
          critical_suites='[
            "preset-machine", "preset-k8s", "preset-microk8s", "preset-dev", "preset-crafts",
            "provider-lxd", "provider-lxd-init-no-bootstrap", "provider-k8s", "provider-microk8s", "provider-google", "provider-none",
            "dry-run-prepare", "dry-run-restore", "restore", "restore-without-prepare"
          ]'

          # critical/extras are GHA matrix configs: {"include": [ {"suite": "...", "base": "...", "runner": "..."}, ... ]}.
          # $per_base already holds the (system, suite) pairs spread would run;
          # dropping the arch-skipped names and attaching each base's runner
          # gives the include list, split by membership in critical_suites.
          pairs=$(jq -c -n --argjson pb "$per_base" --argjson keep "$list" --argjson bases "$BASES" \
            '[ $pb[] as $p | $bases[] | select(.base == $p.base) |
               select($p.suite as $s | $keep | index($s)) |
               {suite: $p.suite, base: $p.base, runner: .runner} ]')
          critical=$(jq -c -n --argjson pairs "$pairs" --argjson crit "$critical_suites" \
            '{include: [ $pairs[] | select(.suite as $s | $crit | index($s)) ]}')
          extras=$(jq -c -n --argjson pairs "$pairs" --argjson crit "$critical_suites" \
            '{include: [ $pairs[] | select(.suite as $s | $crit | index($s) | not) ]}')
          echo "critical=$critical"
          echo "extras=$extras"
          echo "critical=$critical" >> $GITHUB_OUTPUT
          echo "extras=$extras" >> $GITHUB_OUTPUT

  spread-critical:
    name: Spread (${{ matrix.suite }}, ${{ matrix.base }})
    runs-on: ${{ matrix.runner }}
    needs:
      - binaries
      - define-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.critical) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: binary-${{ inputs.arch }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: "go.mod"
          architecture: ${{ inputs.arch }}

      - name: Install
        run: |
          go install github.com/canonical/spread/cmd/spread@a3a44a96b6d00a72b0476756c70e3fb6610e7b48  # 2026-03-26

      - name: Run integration tests
        env:
          SUITE: ${{ matrix.suite }}
          BASE: ${{ matrix.base }}
        run: |
          spread -v "github-ci:${BASE}:tests/${SUITE}"

  spread-extras:
    name: Spread extras (${{ matrix.suite }}, ${{ matrix.base }})
    runs-on: ${{ matrix.runner }}
    needs:
      - binaries
      - define-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.extras) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: binary-${{ inputs.arch }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: "go.mod"
          architecture: ${{ inputs.arch }}

      - name: Install
        run: |
          go install github.com/canonical/spread/cmd/spread@a3a44a96b6d00a72b0476756c70e3fb6610e7b48  # 2026-03-26

      - name: Run integration tests
        env:
          SUITE: ${{ matrix.suite }}
          BASE: ${{ matrix.base }}
        run: |
          spread -v "github-ci:${BASE}:tests/${SUITE}"

  spread-required:
    # Stable-named aggregator job for branch protection. Mark this as the
    # required check; matrix entry names (which change as suites are added
    # or shuffled) are not stable enough to pin individually.
    name: Spread (required)
    runs-on: ubuntu-latest
    needs:
      - spread-critical
    if: always()
    steps:
      - name: Check critical spread tests passed
        env:
          RESULT: ${{ needs.spread-critical.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "spread-critical aggregate result: $RESULT"
            exit 1
          fi
