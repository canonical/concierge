name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'presets/**'
      - '.github/workflows/docs.yaml'
  pull_request:
    paths:
      - 'docs/**'
      - 'presets/**'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  docchecks:
    name: Checks
    runs-on: ubuntu-latest
    outputs:
      linkcheck-result: ${{ steps.linkcheck-step.outcome }}
      spellcheck-result: ${{ steps.spellcheck-step.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Links
        id: linkcheck-step
        if: success() || failure()
        uses: canonical/documentation-workflows/linkcheck@309dd382b6a07cbd23d84e3912fb05e6bc1f4ffb  # main, 2026-08-18
        with:
          working-directory: docs
      - name: Spelling
        id: spellcheck-step
        if: success() || failure()
        uses: canonical/documentation-workflows/spellcheck@309dd382b6a07cbd23d84e3912fb05e6bc1f4ffb  # main, 2026-08-18
        with:
          working-directory: docs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build HTML
        run: make -C docs html
