name: Release

on:
  push:
    tags:
      - v*

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run the same checks and tests that are required to merge to main.
  checks:
    uses: ./.github/workflows/_checks.yaml
    permissions:
      contents: read

  test:
    uses: ./.github/workflows/_tests.yaml
    with:
      arch: amd64
      runner: ubuntu-24.04

  release:
    name: Release concierge
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: write
      # For actions/attest below.
      id-token: write
      attestations: write
    needs:
      - checks
      - test
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Setup goreleaser
        run: |
          sudo snap install --classic goreleaser

      - name: Setup Snapcraft
        run: |
          sudo snap install snapcraft --channel=8.x/stable --classic
          mkdir -p $HOME/.cache/snapcraft/download
          mkdir -p $HOME/.cache/snapcraft/stage-packages

      - name: Release concierge
        id: build
        run: |
          goreleaser release --clean --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_TOKEN }}

      # Attest the release tarballs via GitHub's attestations API and
      # Sigstore transparency log. Consumers verify with
      # `gh attestation verify`.
      #
      # goreleaser v2 has a built-in `slsa:` block that emits a separate
      # `.intoto.jsonl` sidecar in a different format; it is not integrated
      # with GitHub's attestation API and would need its own verification
      # story.
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # 4.2.2
        with:
          subject-path: "dist/*.tar.gz"

  sbom-secscan:
    name: SBOM and secscan
    needs:
      - release
    uses: ./.github/workflows/sbom-secscan.yaml
