juju:
  # The default 20-minute bootstrap timeout is too short for the controller
  # pod to expose its API on slow CI runners; pin a longer one so the
  # preset works out of the box on busy GHA hosts.
  extra-bootstrap-args: --config bootstrap-timeout=1800
  model-defaults:
    test-mode: "true"
    automatically-retry-hooks: "false"

providers:
  lxd:
    enable: true
  microk8s:
    enable: true
    bootstrap: true
    # Ask concierge to auto-detect a MetalLB IP range from the host's
    # primary interface at Prepare() time; override with
    # metallb-ip-range: "<start>-<end>" if the auto-detection picks
    # something that clashes with your network.
    addons:
      - hostpath-storage
      - dns
      - rbac
      - metallb

host:
  packages:
    - gnome-keyring
    - python3-pip
    - python3-venv
  snaps:
    charmcraft:
    jq:
    yq:
    rockcraft:
