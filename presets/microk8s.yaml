juju:
  # The default 20-minute bootstrap timeout is too short for the controller
  # pod to expose its API on slow CI runners; pin a longer one so the
  # preset works out of the box on busy GHA hosts.
  extra-bootstrap-args: --config bootstrap-timeout=1800
  model-defaults:
    test-mode: "true"
    automatically-retry-hooks: "false"

providers:
  lxd:
    enable: true
  microk8s:
    enable: true
    bootstrap: true
    # A bare "metallb" gets 10.64.140.43-10.64.140.49, reachable from this
    # machine and its pods. Use --metallb-ip-range (or
    # CONCIERGE_METALLB_IP_RANGE) to pick a different range.
    addons:
      - hostpath-storage
      - dns
      - rbac
      - metallb

host:
  packages:
    - gnome-keyring
    - python3-pip
    - python3-venv
  snaps:
    charmcraft:
    jq:
    yq:
    rockcraft:
