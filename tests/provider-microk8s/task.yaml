summary: Run concierge with just a MicroK8s provider
systems:
  - ubuntu-24.04

execute: |
  pushd "${SPREAD_PATH}/${SPREAD_TASK}"

  # This test should be fast, so timing out means we are hanging, and it used
  # to expect exactly that: MicroK8s strict 1.33 and below cannot load their
  # containerd AppArmor profile on a kernel with network_v9 mediation, so
  # containerd never starts (canonical/microk8s#5394, still open). The
  # channel in concierge.yaml is what avoids that.
  #
  # Worth knowing if this goes red again: the runner this executes on is
  # 24.04, which has network_v8 and not v9, and tests/microk8s-image-registry
  # was pulling images through containerd on strict 1.31 here quite happily.
  # So whatever made this task hang on the runner was not the profile bug,
  # and a timeout here needs diagnosing rather than attributing to #5394.
  # A hang is a failure again either way, and every assertion below this
  # line only started running when the escape hatch came out.
  timeout 10m "$SPREAD_PATH"/concierge --trace prepare --extra-snaps="yq"

  list="$(snap list microk8s)"
  echo $list | MATCH microk8s
  # Matched loosely on purpose: the version lives in concierge.yaml, and
  # pinning it in two places is why this test sat on 1.31 while the default
  # had moved on.
  echo $list | MATCH strict/stable

  list="$(snap list)"
  echo $list | MATCH juju
  echo $list | MATCH kubectl

  sudo microk8s status --format yaml | yq '.addons[] | select(.name=="hostpath-storage") | .status'
  sudo microk8s status --format yaml | yq '.addons[] | select(.name=="dns") | .status'
  sudo microk8s status --format yaml | yq '.addons[] | select(.name=="metallb") | .status'

  kubectl config current-context | MATCH "microk8s"

  juju controllers | tail -n1 | MATCH concierge-microk8s
  juju models | tail -n1 | MATCH testing

restore: |
  if [[ -z "${CI:-}" ]]; then
    "$SPREAD_PATH"/concierge --trace restore
  fi
